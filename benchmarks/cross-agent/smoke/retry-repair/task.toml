schema_version = "1.3"
artifacts = ["/logs/artifacts/solution.mjs"]

[task]
name = "jev-workflows/smoke-retry-repair"
description = "Portable single-turn coding-agent wiring smoke; not a quality benchmark."
authors = []
keywords = ["smoke-only", "javascript", "coding-agent", "harbor", "pier"]

[metadata]
task_id = "retry-repair"
benchmark_label = "smoke-only"
source_schema = "paired-codex-v1"
source_tasks_sha256 = "e517029eb95b7c9915544b42edc9d8e853810d54047a2bf11a8815a642b4ba43"
source_grader_sha256 = "a91d0dfa79bd27f858f18e8e9dd8e4b6155287ee0a963aec457d0839dd7c8b94"
deep_swe_commit = "0b9fabbb63b9104d678fe965e1632f2dd9eaa2ea"
pier_commit = "4f3441fb3e7c21ce8a4ed0b6155a8d9a176a645a"
multi_turn = false

[verifier]
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 60.0

[verifier.environment]
build_timeout_sec = 300.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
command = "set -eu; test -f /app/solution.mjs; mkdir -p /logs/artifacts; cp /app/solution.mjs /logs/artifacts/solution.mjs"
timeout_sec = 30.0

[agent]
network_mode = "no-network"
timeout_sec = 180.0

[environment]
build_timeout_sec = 300.0
os = "linux"
workdir = "/app"
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
network_mode = "no-network"
mcp_servers = []
